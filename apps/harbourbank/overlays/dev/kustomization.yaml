apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: harbourbank-dev
resources:
  - ../../base
configMapGenerator:
  - name: accounts-api-config
    behavior: merge
    literals:
      - ENVIRONMENT=dev
      # fraud-check on: score customer transfers first. Off in qa and prod until promoted.
      - FRAUD_CHECK_URL=http://fraud-check
      - FRAUD_CHECK_TIMEOUT_SECONDS=0.3
      # While fraud-check is unavailable, a transfer goes through unchecked only if it is up to 50.00
      # AND the account has made fewer than 5 transfers in the last hour (drill 5: takeovers passed)
      - FRAUD_CHECK_FALLBACK_LIMIT_CENTS=5000
      - FRAUD_CHECK_FALLBACK_MAX_TRANSFERS_PER_HOUR=5
patches:
  - target:
      kind: Ingress
      name: accounts-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: accounts-dev.localhost
# Written by harbourbank-app CI on every merge to main - don't edit by hand.
# newTag says which commit; digest makes the reference immutable (a tag can be re-pushed).
images:
  - name: ghcr.io/kuwid73/harbourbank-accounts-api
    newTag: sha-af98694
    digest: sha256:bc9ae383852a15d78205cf69b52362e936085e1856b15e97af0ac54dcb8bec65
