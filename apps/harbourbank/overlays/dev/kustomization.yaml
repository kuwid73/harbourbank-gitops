apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: harbourbank-dev
resources:
  - ../../base
configMapGenerator:
  - name: accounts-api-config
    behavior: merge
    literals:
      - ENVIRONMENT=dev
patches:
  - target:
      kind: Ingress
      name: accounts-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: accounts-dev.localhost
  # dev runs one pod with light traffic: give node capacity back to the other environments
  - target:
      kind: Deployment
      name: accounts-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {cpu: 25m, memory: 32Mi}
          limits: {memory: 48Mi}
# Written by harbourbank-app CI on every merge to main - don't edit by hand.
# newTag says which commit; digest makes the reference immutable (a tag can be re-pushed).
images:
  - name: ghcr.io/kuwid73/harbourbank-accounts-api
    newTag: sha-612ccc1
    digest: sha256:ebb2015194874099e7bc4251687c6a960ff61e2ec9abe53d9f7e5a60acdc737a
