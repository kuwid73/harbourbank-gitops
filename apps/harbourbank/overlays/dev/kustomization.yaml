apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: harbourbank-dev
resources:
  - ../../base
configMapGenerator:
  - name: accounts-api-config
    behavior: merge
    literals:
      - ENVIRONMENT=dev
patches:
  - target:
      kind: Ingress
      name: accounts-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: accounts-dev.localhost


# Written by harbourbank-app CI on every merge to main - don't edit by hand.
# newTag says which commit; digest makes the reference immutable (a tag can be re-pushed).
images:
  - name: ghcr.io/kuwid73/harbourbank-accounts-api
    newTag: sha-8f555c9
    digest: sha256:f6818d11a85f23b35b11f0c65a7060ac62fe9572a320ae8014f1a718d01df440
