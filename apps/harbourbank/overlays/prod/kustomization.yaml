apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: harbourbank-prod
resources:
  - ../../base
configMapGenerator:
  - name: accounts-api-config
    behavior: merge
    literals:
      - ENVIRONMENT=prod
      # Fail fast when the pool is exhausted under prod load, instead of queueing requests
      - DB_POOL_TIMEOUT_SECONDS=5s
  # More customers and traffic in production
  - name: customer-simulator-config
    behavior: merge
    literals:
      - SIM_CUSTOMERS=60
      - SIM_REQUESTS_PER_SECOND=2
patches:
  - target:
      kind: Ingress
      name: accounts-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: accounts.localhost
  # Production: two API pods and a Postgres primary plus a streaming-replication standby
  - target:
      kind: Deployment
      name: accounts-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Cluster
      name: accounts-db
    patch: |-
      - op: replace
        path: /spec/instances
        value: 2
# Changed only by a promotion PR from qa, approved by a code owner.
images:
  - name: ghcr.io/kuwid73/harbourbank-accounts-api
    newTag: sha-612ccc1
    digest: sha256:ebb2015194874099e7bc4251687c6a960ff61e2ec9abe53d9f7e5a60acdc737a
