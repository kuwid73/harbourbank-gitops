apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: harbourbank-qa
resources:
  - ../../base
configMapGenerator:
  - name: accounts-api-config
    behavior: merge
    literals:
      - ENVIRONMENT=qa
patches:
  # fraud-check is off here until a promotion brings an image that contains it: the image
  # pinned below predates it. That promotion sets replicas and FRAUD_CHECK_URL.
  - target:
      kind: Deployment
      name: fraud-check
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Ingress
      name: accounts-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: accounts-qa.localhost
# Changed only by a promotion PR that copies the version proven in dev.
images:
  - name: ghcr.io/kuwid73/harbourbank-accounts-api
    newTag: sha-af98694
    digest: sha256:bc9ae383852a15d78205cf69b52362e936085e1856b15e97af0ac54dcb8bec65
