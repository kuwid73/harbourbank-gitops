apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: harbourbank-qa
resources:
  - ../../base
configMapGenerator:
  - name: accounts-api-config
    behavior: merge
    literals:
      - ENVIRONMENT=qa
patches:
  - target:
      kind: Ingress
      name: accounts-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: accounts-qa.localhost
# Changed only by a promotion PR that copies the version proven in dev.
images:
  - name: ghcr.io/kuwid73/harbourbank-accounts-api
    newTag: sha-2764763
    digest: sha256:659b97cd285ece55927204593250c7a29e90c524df02c92ff07ad9d16bd677ce
