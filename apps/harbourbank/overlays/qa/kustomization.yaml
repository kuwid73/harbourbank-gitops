apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: harbourbank-qa
resources:
  - ../../base
configMapGenerator:
  - name: accounts-api-config
    behavior: merge
    literals:
      - ENVIRONMENT=qa
patches:
  - target:
      kind: Ingress
      name: accounts-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: accounts-qa.localhost
# Changed only by a promotion PR that copies the version proven in dev.
images:
  - name: ghcr.io/kuwid73/harbourbank-accounts-api
    newTag: sha-98e7890
    digest: sha256:358f1502320db81f52b30c97c5890ac1d529c6aafcceca2e8a995d4fdb6567a0
