apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: harbourbank-qa
resources:
  - ../../base
configMapGenerator:
  - name: accounts-api-config
    behavior: merge
    literals:
      - ENVIRONMENT=qa
patches:
  # fraud-check is off here until a promotion brings an image that contains it: the image
  # pinned below predates it. That promotion sets replicas and FRAUD_CHECK_URL.
  - target:
      kind: Deployment
      name: fraud-check
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Ingress
      name: accounts-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: accounts-qa.localhost
# Changed only by a promotion PR that copies the version proven in dev.
images:
  - name: ghcr.io/kuwid73/harbourbank-accounts-api
    newTag: sha-530b5a7
    digest: sha256:68eb163191491dc5b329278eefa3a2252b2f7b90c2d5f5c4be7c58a6b528797c
