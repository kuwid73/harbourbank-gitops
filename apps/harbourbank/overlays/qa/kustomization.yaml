apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: harbourbank-qa
resources:
  - ../../base
configMapGenerator:
  - name: accounts-api-config
    behavior: merge
    literals:
      - ENVIRONMENT=qa
patches:
  - target:
      kind: Ingress
      name: accounts-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: accounts-qa.localhost
# Changed only by a promotion PR that copies the version proven in dev.
images:
  - name: ghcr.io/kuwid73/harbourbank-accounts-api
    newTag: sha-612ccc1
    digest: sha256:ebb2015194874099e7bc4251687c6a960ff61e2ec9abe53d9f7e5a60acdc737a
