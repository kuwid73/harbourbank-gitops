# Schema migration (alembic upgrade head) with the same image as the API.
# A Sync hook in wave 1: ArgoCD runs it after the database is healthy (wave 0) and
# only rolls out the API (wave 2) if it succeeds - new code never meets an old schema.
# Not a PreSync hook: on the first sync the database doesn't exist yet, so a PreSync
# migration would wait forever for its credentials.
apiVersion: batch/v1
kind: Job
metadata:
  name: accounts-db-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    # Keep the last run (and its logs) until the next one - evidence of what ran
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: accounts-db-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/kuwid73/harbourbank-accounts-api
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: accounts-db-app
                  key: uri
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
