# Synthetic customer traffic (simulated customers, synthetic data only), so dashboards,
# alerts and the agents always have realistic activity to observe. See customer_simulator.py.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: customer-simulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: customer-simulator
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: simulator
          # The API's image provides Python; the script comes from the ConfigMap
          image: ghcr.io/kuwid73/harbourbank-accounts-api
          command: ["python", "-I", "/sim/customer_simulator.py", "run"]
          envFrom:
            - configMapRef:
                name: customer-simulator-config
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: sim
              mountPath: /sim
              readOnly: true
      volumes:
        - name: sim
          configMap:
            name: customer-simulator
---
# Salary day: every simulated customer is paid at once, then pays rent and bills - a burst
# of concurrent money movements. Runs on the 25th (UTC); trigger on demand for a demo:
#   kubectl -n harbourbank-prod create job --from=cronjob/salary-day salary-day-demo-1
apiVersion: batch/v1
kind: CronJob
metadata:
  name: salary-day
spec:
  schedule: "0 9 25 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A retry is safe: payment keys derive from the Job's name, so a re-run replays
      # the payments already made instead of paying twice
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: salary-day
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: salary-run
              image: ghcr.io/kuwid73/harbourbank-accounts-api
              command: ["python", "-I", "/sim/customer_simulator.py", "salary-day"]
              envFrom:
                - configMapRef:
                    name: customer-simulator-config
              env:
                - name: RUN_ID   # the Job's name, unique per run and stable across its retries
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.labels['batch.kubernetes.io/job-name']
              resources:
                requests:
                  cpu: 50m
                  memory: 48Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: sim
                  mountPath: /sim
                  readOnly: true
          volumes:
            - name: sim
              configMap:
                name: customer-simulator
