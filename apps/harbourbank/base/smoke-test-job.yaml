# After every sync (PostSync, i.e. once the API rollout is healthy): does the
# environment serve the version just deployed? A failure marks the ArgoCD sync
# as Failed and fires AccountsApiSmokeTestFailed - the evidence a promotion PR
# reviewer checks before approving.
apiVersion: batch/v1
kind: Job
metadata:
  name: accounts-api-smoke-test
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3   # retries ride out the seconds while Service endpoints catch up
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: accounts-api-smoke-test
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smoke-test
          # The API's own image: its baked-in GIT_SHA is the version the test expects
          image: ghcr.io/kuwid73/harbourbank-accounts-api
          command: ["python", "-I", "/smoke/smoke_test.py"]
          envFrom:
            - configMapRef:
                name: accounts-api-config   # ENVIRONMENT
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: smoke
              mountPath: /smoke
              readOnly: true
      volumes:
        - name: smoke
          configMap:
            name: accounts-api-smoke-test
