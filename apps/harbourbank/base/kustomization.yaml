apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: harbourbank
resources:
  - accounts-db.yaml
  - migrate-job.yaml
  - accounts-api.yaml
  - fraud-check.yaml
  - smoke-test-job.yaml
  - customer-simulator.yaml
  - end-of-day.yaml
# Settings shared by every environment; overlays merge in their own values.
# The generated name carries a content hash, so changing a value rolls the pods.
configMapGenerator:
  - name: accounts-api-config
    literals:
      - ENVIRONMENT=unset
      - LOG_LEVEL=INFO
      - DB_POOL_SIZE=5
      - DAILY_TRANSFER_LIMIT_CENTS=1000000
      - INTEREST_RATE_BPS=150   # 1.50% a year, paid daily by the end-of-day batch
  # fraud-check's rules (see harbourbank-app README); a change rolls its pods
  - name: fraud-check-config
    literals:
      - LOG_LEVEL=INFO
      - FRAUD_LARGE_NEW_PAYEE_CENTS=100000   # 1,000.00 first payment to a new payee
      - FRAUD_MAX_TRANSFERS_PER_HOUR=10
      - FRAUD_LARGE_AMOUNT_CENTS=500000      # 5,000.00
      - FRAUD_BLOCK_SCORE=70
  - name: accounts-api-smoke-test
    files:
      - smoke_test.py
  - name: customer-simulator
    files:
      - customer_simulator.py
  # Traffic volume per environment; prod overrides it
  - name: customer-simulator-config
    literals:
      - SIM_CUSTOMERS=20
      - SIM_REQUESTS_PER_SECOND=0.5
      - SALARY_CONCURRENCY=20
