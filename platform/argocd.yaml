# ArgoCD manages its own installation from this repo.
# Upgrading ArgoCD = bump targetRevision here and push.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.11.6
      helm:
        releaseName: argocd
        valueFiles:
          - $values/platform/values/argocd.yaml
    - repoURL: https://github.com/kuwid73/orders-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false                # never let a bad commit delete ArgoCD itself
      selfHeal: true
    syncOptions:
      - ServerSideApply=true      # ArgoCD CRDs are too large for client-side apply
