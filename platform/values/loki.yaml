# Chart defaults target a scalable S3-backed cluster; this is a single-process lab setup.
deploymentMode: SingleBinary

loki:
  auth_enabled: false               # single tenant
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 72h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    size: 5Gi
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# Off: memcached caches default to 8 GB RAM; gateway/canary/tests not needed in the lab
chunksCache:
  enabled: false
resultsCache:
  enabled: false
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
