# Helm values for ArgoCD. Used by bootstrap.sh (first install) and by
# platform/argocd.yaml (ArgoCD managing itself afterwards) - single source of truth.
global:
  domain: argocd.localhost        # http://argocd.localhost:8080 (*.localhost resolves to 127.0.0.1)

configs:
  params:
    server.insecure: true         # serve plain HTTP; local lab only, bound to loopback

dex:
  enabled: false                  # no SSO in the lab; local admin user only

server:
  ingress:
    enabled: true
    ingressClassName: traefik
