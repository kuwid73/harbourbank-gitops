# k3s runs controller-manager, scheduler and proxy inside the k3s binary and uses
# sqlite instead of etcd, so these scrape targets don't exist. Disabling them avoids
# permanently-firing "TargetDown" alerts that would mislead the agent.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

prometheus:
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts: [prometheus.localhost]
    paths: ["/"]
  prometheusSpec:
    retention: 3d
    # Pick up ServiceMonitors/PodMonitors/rules from every namespace, not only
    # ones labelled with this Helm release (our app will ship its own ServiceMonitor)
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false

alertmanager:
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts: [alertmanager.localhost]
    paths: ["/"]
  alertmanagerSpec:
    # The Slack webhook URL (SealedSecret in platform/manifests/monitoring), mounted at
    # /etc/alertmanager/secrets/alertmanager-slack/webhook-url
    secrets: [alertmanager-slack]
  # The chart's defaults (inhibit rules, Watchdog to nowhere), plus one route: prod alerts go to the
  # engineer's Slack channel. dev and qa alerts stay in Alertmanager's UI: nobody is paged for them.
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
      - source_matchers: ['severity = critical']
        target_matchers: ['severity =~ warning|info']
        equal: [namespace, alertname]
      - source_matchers: ['severity = warning']
        target_matchers: ['severity = info']
        equal: [namespace, alertname]
      - source_matchers: ['alertname = InfoInhibitor']
        target_matchers: ['severity = info']
        equal: [namespace]
      - target_matchers: ['alertname = InfoInhibitor']
    route:
      group_by: [namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'null'
      routes:
        - receiver: 'null'
          matchers: ['alertname = "Watchdog"']
        - receiver: slack
          matchers: ['namespace = "harbourbank-prod"', 'severity =~ "warning|critical"']
          repeat_interval: 4h   # an alert still firing is re-posted every 4 hours
    receivers:
      - name: 'null'
      # A bank on Microsoft 365 uses the same route with a Teams workflow webhook instead:
      #   msteamsv2_configs: [{webhook_url_file: <mounted secret>, send_resolved: true}]
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
            send_resolved: true   # also post when the alert clears: that is "restored"
            title: '{{ .Status | toUpper }}: {{ .CommonLabels.alertname }} in {{ .CommonLabels.namespace }}'
            text: >-
              {{ range .Alerts }}*{{ .Labels.alertname }}* ({{ .Labels.severity }}):
              {{ or .Annotations.summary .Annotations.description }}
              {{ end }}
    templates:
      - '/etc/alertmanager/config/*.tmpl'

grafana:
  admin:
    existingSecret: grafana-admin     # SealedSecret in platform/manifests/monitoring
    userKey: admin-user
    passwordKey: admin-password
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts: [grafana.localhost]
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc:3100
