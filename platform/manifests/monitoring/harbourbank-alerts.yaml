# Alert rules for every Harbour Bank environment, defined once. Each alert carries the
# `namespace` label (harbourbank-dev/qa/prod); severity is critical in prod, warning elsewhere.
# The annotations are written for the on-call engineer - and for the diagnosing agent.
# Job alerts use kube_job_failed: the Job gave up after its retries. A failed attempt
# that a retry fixed (kube_job_status_failed > 0) is not an incident.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: harbourbank
  namespace: monitoring
spec:
  groups:
    - name: harbourbank.accounts-api
      rules:
        - alert: AccountsApiUnavailable
          expr: kube_deployment_status_replicas_available{namespace=~"harbourbank-.*", deployment="accounts-api"} == 0
          for: 2m
          labels:
            severity: '{{ if eq $labels.namespace "harbourbank-prod" }}critical{{ else }}warning{{ end }}'
          annotations:
            summary: "accounts-api has no ready pods in {{ $labels.namespace }}"
            description: "Customers cannot use internet banking. Check pod status/events (crash loop, failed readiness = database unreachable, image pull, config error in the startup log)."
        - alert: AccountsApiHighErrorRate
          expr: |
            sum by (namespace) (rate(http_requests_total{job="accounts-api", status=~"5.."}[5m]))
              / sum by (namespace) (rate(http_requests_total{job="accounts-api"}[5m])) > 0.05
          for: 5m
          labels:
            severity: '{{ if eq $labels.namespace "harbourbank-prod" }}critical{{ else }}warning{{ end }}'
          annotations:
            summary: "{{ $value | humanizePercentage }} of accounts-api requests fail in {{ $labels.namespace }}"
            description: "Over 5% of requests return 5xx. The `error` field in the JSON logs tells which: database_unavailable, db_pool_exhausted or internal_error (with request_id)."
        - alert: AccountsApiSlowResponses
          expr: |
            histogram_quantile(0.95, sum by (namespace, le) (
              rate(http_request_duration_seconds_bucket{job="accounts-api", route!~"/healthz|/readyz|/metrics|/info"}[5m])
            )) > 0.5
          for: 10m
          labels:
            severity: '{{ if eq $labels.namespace "harbourbank-prod" }}critical{{ else }}warning{{ end }}'
          annotations:
            summary: "accounts-api p95 latency is {{ $value | humanizeDuration }} in {{ $labels.namespace }}"
            description: "95th percentile above 500ms. Compare per-route latency; slow SQL (>500ms) is logged by Postgres; check database CPU and connection-pool usage."
        - alert: AccountsApiDbPoolSaturated
          expr: max by (namespace, pod) (db_pool_connections_in_use{job="accounts-api"} / db_pool_size{job="accounts-api"}) >= 1
          for: 2m
          labels:
            severity: '{{ if eq $labels.namespace "harbourbank-prod" }}critical{{ else }}warning{{ end }}'
          annotations:
            summary: "Database connection pool full on {{ $labels.pod }} ({{ $labels.namespace }})"
            description: "All pooled connections are in use; new requests wait, then fail with 503 db_pool_exhausted. Look for slow queries or long transactions; DB_POOL_SIZE is in the accounts-api-config ConfigMap."
        - alert: AccountsDbMigrationFailed
          expr: kube_job_failed{namespace=~"harbourbank-.*", job_name="accounts-db-migrate", condition="true"} == 1
          labels:
            severity: '{{ if eq $labels.namespace "harbourbank-prod" }}critical{{ else }}warning{{ end }}'
          annotations:
            summary: "Database migration failed in {{ $labels.namespace }}"
            description: "ArgoCD stopped the rollout, so the previous API version keeps running. The migration Job's logs show the failing Alembic revision."
        - alert: AccountsApiSmokeTestFailed
          expr: kube_job_failed{namespace=~"harbourbank-.*", job_name="accounts-api-smoke-test", condition="true"} == 1
          labels:
            severity: '{{ if eq $labels.namespace "harbourbank-prod" }}critical{{ else }}warning{{ end }}'
          annotations:
            summary: "Post-deployment smoke test failed in {{ $labels.namespace }}"
            description: "The version just deployed is not serving correctly (not ready, wrong version, or database lookups failing). Do not promote it; the smoke test Job's logs list the failed checks."
    - name: harbourbank.accounts-db
      rules:
        - alert: AccountsDbDown
          expr: cnpg_collector_up{namespace=~"harbourbank-.*"} == 0
          for: 2m
          labels:
            severity: '{{ if eq $labels.namespace "harbourbank-prod" }}critical{{ else }}warning{{ end }}'
          annotations:
            summary: "Postgres instance {{ $labels.pod }} is down in {{ $labels.namespace }}"
            description: "The CloudNativePG metrics exporter reports Postgres as not running. Check the Cluster status (kubectl get cluster accounts-db) and the instance pod's logs."
    # Published by accounts-api from the eod_runs table (the batch Job is too short-lived to scrape).
    # max by (namespace): every API replica reports the same values.
    - name: harbourbank.end-of-day
      rules:
        - alert: BankLedgerOutOfBalance
          expr: |
            max by (namespace) (abs(bank_ledger_imbalance_cents{namespace=~"harbourbank-.*"})) > 0
            or max by (namespace) (bank_ledger_inconsistencies{namespace=~"harbourbank-.*"}) > 0
          labels:
            severity: '{{ if eq $labels.namespace "harbourbank-prod" }}critical{{ else }}warning{{ end }}'
          annotations:
            summary: "The ledger does not balance in {{ $labels.namespace }}"
            description: "The last end-of-day check found balances that do not sum to zero, or accounts/transfers whose ledger entries disagree. No interest is paid until it is fixed. Query eod_runs for the failing day and verify_ledger() for the affected accounts; treat as a financial incident."
        # The batch closes yesterday at 00:15 UTC, so the latest closed business day is normally
        # 24-48h old. Over 49h means yesterday was still not closed by 01:00 (job failed or never ran).
        - alert: EndOfDayBatchOverdue
          expr: time() - max by (namespace) (bank_eod_last_business_date_timestamp_seconds{namespace=~"harbourbank-.*"}) > 49 * 3600
          for: 15m
          labels:
            severity: '{{ if eq $labels.namespace "harbourbank-prod" }}critical{{ else }}warning{{ end }}'
          annotations:
            summary: "Yesterday's business day has not been closed in {{ $labels.namespace }}"
            description: "The end-of-day batch has not closed a business day for {{ $value | humanizeDuration }} (since its start). Interest is not being paid. Check the end-of-day CronJob's recent Jobs and their logs; a failed day is retried by the next run, or manually with kubectl create job --from=cronjob/end-of-day."
