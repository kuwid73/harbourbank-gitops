# The Slack webhook URL Alertmanager posts prod alerts to, encrypted for this cluster's
# sealed-secrets controller. Re-create it with bootstrap/seal-slack-webhook.sh.
---
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: alertmanager-slack
  namespace: monitoring
spec:
  encryptedData:
    webhook-url: 
  template:
    metadata:
      name: alertmanager-slack
      namespace: monitoring
