# Identities that AI agents use to reach the cluster. Phase 2: harbourbank-observer, read-only.
# Every permission an agent has is defined here, in Git, and changed only through a reviewed PR.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-access
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kuwid73/harbourbank-gitops.git
    targetRevision: main
    path: platform/manifests/agent-access
  destination:
    server: https://kubernetes.default.svc
    namespace: agent-access
  syncPolicy:
    automated:
      prune: true
      selfHeal: true     # a hand-edited permission is reverted to what Git says
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        # Nothing runs here; the namespace only holds service accounts
        pod-security.kubernetes.io/enforce: restricted
